<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="messageStyle.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="x-icon" href="./assets/favicon.png">
</head>
<body>
    <div class="message-container">
        <form action="https://api.web3forms.com/submit" method="POST" class="message-left">
            <div class="message-left-title">
                <h2>Get in Touch</h2>
                
                
            </div>
            <input type="hidden" name="access_key" value="89dc184e-8713-4ce3-94cf-fca501e95c46">
            <input type="text" name="name" 
            placeholder="Your name" class="message-inputs" required>
            <input type="email" name="Email" 
            placeholder="Your Email" class="message-inputs" required>
            <textarea name="message" placeholder="Your Message" 
            class="message-inputs" required></textarea>
            <button type="submit"> Submit <img src="./assets/MessageArrow_icon.png" alt=""></button>
        </form>
        <div class="message-right">
            <img src="./assets/MessageLogoRight_img.png" alt="">

        </div>
    </div>

    
    <footer class="ok">
        <hr>
        <nav>
            <div class="nav-links-container1">

                    <li><a href="index.html">Home</a></li>
                    
                </ul>
            </div>
        </nav>
        <p>For Portfolio Only | 2024 | No Copyright Intended</p>
